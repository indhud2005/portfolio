<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  <circle cx="700" cy="80" r="180" fill="#06b6d4" opacity="0.08"/>
  <circle cx="100" cy="380" r="150" fill="#3b82f6" opacity="0.08"/>

  <!-- Window Container -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Browser/App Header -->
    <rect width="680" height="360" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>
    <rect width="680" height="44" rx="12" fill="#131e3a"/>
    <circle cx="26" cy="22" r="6" fill="#ef4444"/>
    <circle cx="46" cy="22" r="6" fill="#eab308"/>
    <circle cx="66" cy="22" r="6" fill="#22c55e"/>

    <rect x="140" y="10" width="400" height="24" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="340" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">https://recruitlink.dev/careers</text>

    <!-- App Body -->
    <!-- Nav in app -->
    <rect x="25" y="60" width="100" height="18" rx="4" fill="url(#cyanAccent)"/>
    <text x="32" y="73" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff">RecruitLink</text>
    <rect x="490" y="62" width="60" height="14" rx="3" fill="#1e293b"/>
    <rect x="560" y="62" width="95" height="14" rx="3" fill="#0ea5e9"/>

    <!-- Search bar banner -->
    <rect x="25" y="95" width="630" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="45" y="125" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Search role: "Software Engineer", "React Developer", "Remote"...</text>
    <rect x="535" y="103" width="105" height="34" rx="6" fill="url(#cyanAccent)"/>
    <text x="587" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Search Jobs</text>

    <!-- Job Cards Grid -->
    <!-- Card 1 -->
    <rect x="25" y="160" width="305" height="175" rx="8" fill="#131e3a" stroke="#06b6d4" stroke-opacity="0.3"/>
    <rect x="40" y="175" width="36" height="36" rx="6" fill="#3b82f6" opacity="0.2"/>
    <text x="58" y="198" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#60a5fa" text-anchor="middle">R</text>
    <text x="86" y="188" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Senior Full Stack Dev</text>
    <text x="86" y="204" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Nexus Labs • Chennai / Remote</text>

    <text x="40" y="235" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Building high scale microservices and responsive web consoles.</text>

    <!-- Chips -->
    <rect x="40" y="255" width="55" height="18" rx="4" fill="#1e293b"/>
    <text x="67" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">React</text>
    <rect x="102" y="255" width="60" height="18" rx="4" fill="#1e293b"/>
    <text x="132" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Node.js</text>
    <rect x="169" y="255" width="55" height="18" rx="4" fill="#1e293b"/>
    <text x="196" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">MySQL</text>

    <rect x="40" y="290" width="85" height="26" rx="5" fill="#06b6d4"/>
    <text x="82" y="307" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffffff" text-anchor="middle">Apply Now</text>

    <!-- Card 2 -->
    <rect x="350" y="160" width="305" height="175" rx="8" fill="#131e3a" stroke="#334155"/>
    <rect x="365" y="175" width="36" height="36" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="383" y="198" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#34d399" text-anchor="middle">G</text>
    <text x="411" y="188" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Junior Frontend Dev</text>
    <text x="411" y="204" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Finova Corp • Bangalore</text>

    <text x="365" y="235" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Interactive component architecture &amp; dashboard rendering.</text>

    <!-- Chips -->
    <rect x="365" y="255" width="60" height="18" rx="4" fill="#1e293b"/>
    <text x="395" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Next.js</text>
    <rect x="432" y="255" width="68" height="18" rx="4" fill="#1e293b"/>
    <text x="466" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">TypeScript</text>

    <rect x="365" y="290" width="85" height="26" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="407" y="307" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Details</text>
  </g>
</svg>

