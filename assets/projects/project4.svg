<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#061c24"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>
  <circle cx="150" cy="120" r="160" fill="#10b981" opacity="0.06"/>
  <circle cx="680" cy="300" r="180" fill="#8b5cf6" opacity="0.06"/>

  <!-- AI App Window -->
  <g transform="translate(60, 45)" filter="url(#shadow4)">
    <rect width="680" height="360" rx="12" fill="#090e17" stroke="#1e293b" stroke-width="2"/>
    <rect width="680" height="40" rx="12" fill="#111827"/>
    <circle cx="25" cy="20" r="6" fill="#ef4444"/>
    <circle cx="45" cy="20" r="6" fill="#eab308"/>
    <circle cx="65" cy="20" r="6" fill="#22c55e"/>
    <text x="340" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" text-anchor="middle">NeuroVision AI // Convolutional Neural Net (ResNet-50 Classifier)</text>

    <!-- Left: Image Input & Detection Bounding Boxes -->
    <rect x="25" y="55" width="280" height="280" rx="10" fill="#030712" stroke="#1e293b"/>
    <!-- Simulated scanned drone / satellite / wildlife image -->
    <rect x="40" y="70" width="250" height="190" rx="8" fill="#1e293b"/>
    <circle cx="120" cy="150" r="40" fill="#065f46" opacity="0.6"/>
    <circle cx="200" cy="170" r="50" fill="#047857" opacity="0.4"/>
    <polygon points="165,110 185,150 145,150" fill="#10b981"/>

    <!-- Detection Bounding Box -->
    <rect x="130" y="100" width="105" height="110" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="130" y="85" width="90" height="15" fill="#22d3ee"/>
    <text x="135" y="96" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#0f172a">Canopy 98.4%</text>

    <!-- Scanline effect -->
    <line x1="40" y1="140" x2="290" y2="140" stroke="#34d399" stroke-width="2" opacity="0.8"/>

    <text x="40" y="285" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Input: 1080x1080 RGB tensor</text>
    <text x="40" y="305" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Latency: 14.2ms / frame (CUDA)</text>

    <!-- Right: Neural Classification Probabilities -->
    <rect x="325" y="55" width="330" height="280" rx="10" fill="#0d1527" stroke="#1e293b"/>
    <text x="345" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Model Inference Predictions</text>
    <text x="345" y="103" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Architecture: PyTorch ResNet-50 + Softmax</text>

    <!-- Class 1 -->
    <text x="345" y="135" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Dense Forest Canopy</text>
    <text x="635" y="135" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" text-anchor="end">98.4%</text>
    <rect x="345" y="145" width="290" height="10" rx="5" fill="#1e293b"/>
    <rect x="345" y="145" width="285" height="10" rx="5" fill="url(#aiGrad)"/>

    <!-- Class 2 -->
    <text x="345" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Riparian Vegetative Zone</text>
    <text x="635" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="end">1.2%</text>
    <rect x="345" y="190" width="290" height="10" rx="5" fill="#1e293b"/>
    <rect x="345" y="190" width="30" height="10" rx="5" fill="#38bdf8"/>

    <!-- Class 3 -->
    <text x="345" y="225" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Urban Fringe Terrain</text>
    <text x="635" y="225" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="end">0.4%</text>
    <rect x="345" y="235" width="290" height="10" rx="5" fill="#1e293b"/>
    <rect x="345" y="235" width="12" height="10" rx="5" fill="#64748b"/>

    <!-- Bottom summary tag -->
    <rect x="345" y="270" width="290" height="48" rx="6" fill="#131e3a" stroke="#1e293b"/>
    <text x="360" y="290" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">✓ Confidence Score &gt; 95% threshold</text>
    <text x="360" y="307" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">Output stream verified: 0 False Positives</text>
  </g>
</svg>

