<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c43"/>
      <stop offset="50%" stop-color="#053b50"/>
      <stop offset="100%" stop-color="#176b87"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  <circle cx="680" cy="90" r="130" fill="#64ccc5" opacity="0.1"/>

  <!-- Weather UI Window -->
  <g transform="translate(60, 45)" filter="url(#shadow3)">
    <rect width="680" height="360" rx="12" fill="#09182b" stroke="#176b87" stroke-width="2"/>
    <rect width="680" height="40" rx="12" fill="#0f2642"/>
    <circle cx="25" cy="20" r="6" fill="#ef4444"/>
    <circle cx="45" cy="20" r="6" fill="#eab308"/>
    <circle cx="65" cy="20" r="6" fill="#22c55e"/>
    <text x="340" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64ccc5" text-anchor="middle">Skycast // Real-Time Meteorological Observatory</text>

    <!-- Main Weather Banner (Chennai, 31°C, Partly Cloudy) -->
    <rect x="25" y="55" width="410" height="150" rx="10" fill="#112948" stroke="#1d456f"/>
    <!-- Sun & Cloud Graphic -->
    <circle cx="75" cy="110" r="26" fill="url(#sunGlow)"/>
    <path d="M65 125 C65 110, 85 105, 95 115 C105 105, 125 110, 125 125 C135 125, 140 135, 130 142 L65 142 Z" fill="#e2e8f0" opacity="0.85"/>
    <text x="155" y="105" font-family="'Inter', sans-serif" font-weight="800" font-size="44" fill="#ffffff">31°C</text>
    <text x="155" y="130" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#64ccc5">Partly Cloudy • Chennai, IN</text>
    <text x="155" y="148" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Feels like 34°C • Humidity: 72% • Wind: 14 km/h ENE</text>
    <text x="155" y="180" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Air Quality: Good (AQI 42) | UV Index: 6 (Moderate)</text>

    <!-- Metrics Cards (Right side) -->
    <rect x="450" y="55" width="205" height="70" rx="8" fill="#112948" stroke="#1d456f"/>
    <text x="465" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Precipitation Chance</text>
    <text x="465" y="106" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="20" fill="#38bdf8">18%</text>

    <rect x="450" y="135" width="205" height="70" rx="8" fill="#112948" stroke="#1d456f"/>
    <text x="465" y="158" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Barometric Pressure</text>
    <text x="465" y="186" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="20" fill="#34d399">1012 hPa</text>

    <!-- 5-Day Forecast Strip -->
    <text x="25" y="232" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">5-Day Temperature Trend</text>
    <g transform="translate(25, 245)">
      <!-- Day 1 -->
      <rect x="0" y="0" width="118" height="95" rx="6" fill="#112948" stroke="#176b87"/>
      <text x="59" y="22" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#f8fafc" text-anchor="middle">Today</text>
      <text x="59" y="52" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">⛅</text>
      <text x="59" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64ccc5" text-anchor="middle">31° / 26°</text>

      <!-- Day 2 -->
      <rect x="128" y="0" width="118" height="95" rx="6" fill="#112948"/>
      <text x="187" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Tomorrow</text>
      <text x="187" y="52" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">☀️</text>
      <text x="187" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">33° / 27°</text>

      <!-- Day 3 -->
      <rect x="256" y="0" width="118" height="95" rx="6" fill="#112948"/>
      <text x="315" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Thursday</text>
      <text x="315" y="52" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🌦️</text>
      <text x="315" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">29° / 25°</text>

      <!-- Day 4 -->
      <rect x="384" y="0" width="118" height="95" rx="6" fill="#112948"/>
      <text x="443" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Friday</text>
      <text x="443" y="52" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🌧️</text>
      <text x="443" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">28° / 24°</text>

      <!-- Day 5 -->
      <rect x="512" y="0" width="118" height="95" rx="6" fill="#112948"/>
      <text x="571" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Saturday</text>
      <text x="571" y="52" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🌤️</text>
      <text x="571" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">32° / 26°</text>
    </g>
  </g>
</svg>

